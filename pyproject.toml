[project]
name = "vybe"
version = "0.1.0"
description = "A grounded, AI-assisted music recommendation application"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
